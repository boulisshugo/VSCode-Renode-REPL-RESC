name: Release

# Publishes a GitHub Release with the packaged .vsix attached.
# Trigger by pushing a tag (git tag v0.2.0 && git push origin v0.2.0),
# or manually from the Actions tab, which tags the current commit with
# v<version> taken from package.json.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Package the extension
        id: meta
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          vsix="renode-repl-resc-${version}.vsix"
          npx --yes @vscode/vsce package --out "$vsix"
          test -s "$vsix"
          # The JetBrains TextMate bundle ships from the same grammars.
          bundle="renode-textmate-bundle-${version}.zip"
          node tools/build-textmate-bundle.mjs --out "dist/renode-textmate-bundle"
          (cd dist && zip -qr "../$bundle" renode-textmate-bundle)
          test -s "$bundle"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then tag="${GITHUB_REF_NAME}"; else tag="v${version}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Extract the changelog section for this version
        run: |
          set -euo pipefail
          awk -v v="${{ steps.meta.outputs.version }}" '
            $0 == "## " v { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          printf '\n## Install\n\n**VS Code** — download `%s`, open the Extensions panel, choose **Install from VSIX...** from the `...` menu and pick the file (or `code --install-extension %s`).\n\n**JetBrains (Rider, IntelliJ, CLion)** — download `%s`, unzip it, then add the folder under **Settings -> Editor -> TextMate Bundles**.\n' \
            "${{ steps.meta.outputs.vsix }}" "${{ steps.meta.outputs.vsix }}" "${{ steps.meta.outputs.bundle }}" >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          vsix="${{ steps.meta.outputs.vsix }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$vsix" "${{ steps.meta.outputs.bundle }}" --clobber
            gh release edit "$tag" --notes-file RELEASE_NOTES.md
          else
            gh release create "$tag" "$vsix" "${{ steps.meta.outputs.bundle }}" \
              --title "$tag" \
              --notes-file RELEASE_NOTES.md \
              --target "$GITHUB_SHA"
          fi
          # Fail loudly if the asset did not actually attach.
          names="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          echo "$names" | grep -qx "$vsix"
          echo "$names" | grep -qx "${{ steps.meta.outputs.bundle }}"
