name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx --yes @vscode/vsce package --out renode-repl-resc.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: renode-repl-resc.vsix
